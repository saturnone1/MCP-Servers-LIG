apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-plantuml
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-plantuml
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-plantuml
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-plantuml
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-plantuml
          image: local/mcp-plantuml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-plantuml-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
