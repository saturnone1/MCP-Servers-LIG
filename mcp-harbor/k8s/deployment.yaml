apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-harbor
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-harbor
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-harbor
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-harbor
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-harbor
          image: local/mcp-harbor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-harbor-config
            - secretRef:
                name: mcp-harbor-auth
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
