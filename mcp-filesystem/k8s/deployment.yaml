apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-filesystem
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-filesystem
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-filesystem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-filesystem
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-filesystem
          image: local/mcp-filesystem:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-filesystem-config
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mcp-filesystem-workspace
