apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kubernetes
  namespace: mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-kubernetes
  namespace: mcp-servers
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-kubernetes
  namespace: mcp-servers
subjects:
  - kind: ServiceAccount
    name: mcp-kubernetes
    namespace: mcp-servers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-kubernetes
