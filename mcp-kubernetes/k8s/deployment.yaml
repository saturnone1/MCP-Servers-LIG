apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-kubernetes
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-kubernetes
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: mcp-kubernetes
      containers:
        - name: mcp-kubernetes
          image: local/mcp-kubernetes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mcp-kubernetes-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
