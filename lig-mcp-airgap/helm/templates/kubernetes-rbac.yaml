apiVersion: v1
kind: ServiceAccount
metadata: { name: lig-mcp-kubernetes }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: lig-mcp-kubernetes-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: lig-mcp-kubernetes, namespace: "{{ .Release.Namespace }}" }
