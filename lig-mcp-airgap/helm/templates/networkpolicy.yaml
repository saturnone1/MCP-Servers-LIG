apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: lig-mcp }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: lig-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.clientNamespaceSelector | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8000 }
